[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bio_visual_neural_core"
version = "3.0.0"
description = "Wearable Edge-AI Optical-to-Neural Electrical Stimulation Translation System"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Taha Ben Hadj Hassine" }
]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyserial>=3.5",
]
